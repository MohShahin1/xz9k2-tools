# Save this file as: .github/workflows/watcher.yml in your repo
# (that exact folder structure matters — GitHub only looks for workflows there)

name: Kijiji Car Watcher

on:
  schedule:
    # Runs every 15 minutes. GitHub may delay this slightly during busy
    # periods, but it'll always catch up. Cron is in UTC.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Lets you manually trigger a run from the GitHub Actions tab, useful for testing.

permissions:
  contents: write   # needed so the workflow can save kijiji_seen.json back to the repo

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run the watcher
        env:
          KIJIJI_SEARCH_URL: ${{ secrets.KIJIJI_SEARCH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kijiji_car_watcher.py

      - name: Save updated "seen" list back to the repo
        run: |
          git config user.name "kijiji-watcher-bot"
          git config user.email "actions@github.com"
          git add kijiji_seen.json
          git diff --staged --quiet || git commit -m "Update seen listings"
          git push
